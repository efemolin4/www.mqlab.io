<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MQLab Consulting | Estrategia y Desarrollo Comercial</title>
<meta name="description" content="Consultoría en marketing estratégico, branding y desarrollo comercial. Estrategia, equilibrio y movimiento para tu negocio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f3;
    --ink:#111;
    --grey:#bdbdbd;
    --teal:#2a9d9d;
    --pink:#f1bcd5;
    --speed:50s;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Inter",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .stage{position:fixed;inset:0;overflow:hidden}

  .grain{
    position:absolute;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:multiply;z-index:4;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>");
  }

  /* Halo de foco en el centro */
  .lens{
    position:absolute;left:50%;top:50%;z-index:0;
    width:min(92vw,900px);height:clamp(110px,18vh,180px);
    transform:translate(-50%,-50%);border-radius:999px;
    background:radial-gradient(ellipse,rgba(241,188,213,.6),rgba(241,188,213,0) 70%);
    pointer-events:none;
  }

  /* Columna vertical */
  .column{
    position:absolute;inset:0;z-index:1;
    display:flex;justify-content:center;
    -webkit-mask-image:linear-gradient(transparent 60px,#000 25%,#000 70%,transparent calc(100% - 115px));
            mask-image:linear-gradient(transparent 60px,#000 25%,#000 70%,transparent calc(100% - 115px));
  }
  .row{
    display:flex;flex-direction:column;align-items:center;height:max-content;
    animation:down var(--speed) linear infinite;
  }
  .stage.is-paused .row{animation-play-state:paused}
  .track{display:flex;flex-direction:column;align-items:center}
  .item{
    display:inline-block;transform-origin:center;
    font-size:clamp(20px,3.2vw,44px);font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
    color:var(--grey);
  }
  .star{
    color:var(--pink);font-size:clamp(12px,1.4vw,18px);
    margin:clamp(16px,2.6vh,28px) 0;
  }
  /* de arriba hacia abajo */
  @keyframes down{
    from{transform:translateY(-50%)}
    to{transform:translateY(0)}
  }

  /* Marcas laterales del foco */
  .tick{
    position:absolute;top:50%;z-index:2;transform:translateY(-50%);
    display:flex;align-items:center;gap:10px;
    font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#8a8a8a;
  }
  .tick.l{left:clamp(16px,3vw,40px)}
  .tick.r{right:clamp(16px,3vw,40px);flex-direction:row-reverse}
  .tick i{display:block;width:clamp(20px,4vw,56px);height:1px;background:var(--pink)}
  .tick b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

  /* UI mínima */
  .corner{position:absolute;z-index:3;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#8a8a8a}
  .logo{top:24px;left:clamp(16px,3vw,40px);font-size:16px;letter-spacing:.03em;font-weight:700;text-transform:none;color:var(--ink)}
  .logo span{color:var(--teal)}
  .tag{top:26px;right:clamp(16px,3vw,40px)}
  .cta{bottom:24px;left:50%;transform:translateX(-50%)}
  .cta a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--pink);padding-bottom:3px}
  .cta a:hover{color:var(--teal)}

  .motion{position:absolute;bottom:max(64px,calc(env(safe-area-inset-bottom) + 56px));left:50%;transform:translateX(-50%);z-index:3;border:0;background:transparent;color:#666;font:inherit;font-size:11px;padding:12px;cursor:pointer}
  a:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:5px}
  .cta{bottom:max(24px,env(safe-area-inset-bottom));white-space:nowrap}
  .cta a{display:inline-block;padding:12px 0;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
  @media (max-width:640px){
    .tag,.tick span{display:none}
    .item{letter-spacing:.03em}
  }
  @media (prefers-reduced-motion:reduce){
    html,body{height:auto;overflow:auto}
    .stage{position:relative;min-height:100svh;padding:100px 24px 140px}
    .column{position:relative;mask-image:none;-webkit-mask-image:none;overflow:visible}
    .row{animation:none;width:100%}
    .track{width:100%;gap:20px}
    .track[aria-hidden],.star,.tick,.motion{display:none}
    .item{font-size:clamp(15px,3.2vw,32px);white-space:normal;text-align:center;color:var(--ink)}
  }
</style>
</head>
<body>
<main class="stage" aria-label="Servicios de MQLab">
  <h1 class="sr-only">MQLab Consulting — Marketing estratégico y desarrollo comercial</h1>
  <div class="lens" aria-hidden="true"></div>

  <div class="column"><div class="row" id="row"></div></div>

  <div class="tick l" aria-hidden="true"><span>En foco</span><i></i></div>
  <div class="tick r" aria-hidden="true"><span><b id="idx">01</b> / <b>11</b></span><i></i></div>

  <div class="corner logo">MQ<span>Lab</span></div>
  <div class="corner tag">Estrategia · Equilibrio · Movimiento</div>
  <button class="motion" type="button" aria-pressed="false">Pausar movimiento</button>
  <div class="corner cta"><a href="mailto:felipe.molina@mqlab.io?subject=Agendar%20una%20conversaci%C3%B3n">Agenda una conversación</a></div>

  <div class="grain" aria-hidden="true"></div>
</main>

<script>
  const servicios = [
    "Estrategia de Marketing","Branding","Dirección Comercial",
    "RRPP · Comunicación · Cultura","Productos Digitales",
    "Estrategia de Prospección","Contenido Corporativo",
    "Material de Apoyo a la Venta","Performance Digital",
    "Fidelización y Satisfacción","Reuniones Efectivas"
  ];

  // Dos copias apiladas → loop vertical infinito
  const row = document.getElementById("row");
  for (let c = 0; c < 2; c++){
    const t = document.createElement("div");
    t.className = "track";
    if (c) t.setAttribute("aria-hidden","true");
    t.innerHTML = servicios.map((s,i) =>
      `<span class="star" aria-hidden="true">✦</span><span class="item" data-i="${i}">${s}</span>`).join("");
    row.appendChild(t);
  }

  // Efecto lupa: crece y se oscurece según distancia al centro vertical
  const items = [...row.querySelectorAll(".item")];
  const idx = document.getElementById("idx");
  const g0 = 189, g1 = 17; // gris → tinta
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const stage = document.querySelector(".stage");
  const motion = document.querySelector(".motion");
  let frame;
  motion.addEventListener("click", () => {
    const paused = stage.classList.toggle("is-paused");
    motion.setAttribute("aria-pressed", String(paused));
    motion.textContent = paused ? "Reanudar movimiento" : "Pausar movimiento";
  });
  function fitItems(){
    items.forEach(el => { el.style.fontSize = ""; el.style.transform = ""; });
    if (reducedMotion.matches) return;
    const available = Math.max(1, innerWidth - (innerWidth <= 640 ? 64 : 300));
    const widest = Math.max(...items.map(el => el.getBoundingClientRect().width));
    const base = parseFloat(getComputedStyle(items[0]).fontSize);
    if (widest * 1.6 > available) items.forEach(el => el.style.fontSize = `${base * available / (widest * 1.6)}px`);
  }
  function lens(){
    const cy = innerHeight / 2;
    const r = innerHeight * 0.22;
    let best = null, bestD = Infinity;
    for (const el of items){
      const b = el.getBoundingClientRect();
      const dist = Math.abs(b.top + b.height / 2 - cy);
      if (dist > innerHeight) continue;
      const k = 1 - Math.min(1, dist / r);
      const e = k * k * (3 - 2 * k); // suavizado
      el.style.transform = `scale(${1 + e * 0.6})`;
      const g = Math.round(g0 - (g0 - g1) * e);
      el.style.color = `rgb(${g},${g},${g})`;
      if (dist < bestD){ bestD = dist; best = el; }
    }
    if (best) idx.textContent = String(+best.dataset.i + 1).padStart(2,"0");
    frame = requestAnimationFrame(lens);
  }
  function start(){
    cancelAnimationFrame(frame);
    fitItems();
    if (!reducedMotion.matches && !document.hidden) frame = requestAnimationFrame(lens);
    else items.forEach(el => { el.style.transform = ""; el.style.color = ""; });
  }
  addEventListener("resize", start);
  reducedMotion.addEventListener("change", start);
  document.addEventListener("visibilitychange", start);
  document.fonts.ready.then(start);
  start();
</script>
</body>
</html>
